[package]
authors = ["pleme-io"]
description = "lava-presets — typed Profile overlays for the lava + tatara-lisp ecosystem. Pangea Presets.apply analog. A Preset is a named bag of bindings that layers on top of an architecture call; PresetRegistry::apply walks the precedence chain (operator bindings > preset overlay > architecture defaults). Author presets inline via PresetRegistry or load from (deflava-preset …) .tlisp forms."
edition = "2024"
license = "MIT"
name = "lava-presets"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-presets"
version = "0.1.1"

[lib]
name = "lava_presets"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-eval = { git = "https://github.com/pleme-io/lava-eval", branch = "main" }
